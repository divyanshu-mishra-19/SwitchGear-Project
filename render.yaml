services:
  - type: web
    name: circuitguard-ai
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMP_NUM_THREADS
        value: "1"
      - key: KMP_DUPLICATE_LIB_OK
        value: "True"

